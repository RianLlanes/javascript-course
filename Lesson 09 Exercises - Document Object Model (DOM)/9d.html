<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9d</title>
</head>
<body>
  <input type="text" name="" id="" class="js-input">
  <button class="js-button" onclick="submitName();">Submit</button>
  <p class="js-name"></p>
  <script>
    function submitName() {
      let inputElement = document.querySelector('.js-input');

      document.querySelector('.js-name')
        .innerHTML = `Your name is: ${inputElement.value}`;
    }

  </script>
</body>
</html>
