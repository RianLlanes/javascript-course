<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8h</title>
</head>
<body>

  <p class="js-calculation"></p>
  <p>
    <button onclick="
      updateCalculation('1');
    ">
      1
    </button>
    <button onclick="
      updateCalculation('2');
    ">
      2
    </button>
    <button onclick="
      updateCalculation('3');
    ">
      3
    </button>
  </p>

  <p>
    <button onclick="
      updateCalculation('4');
    ">
      4
    </button>
    <button onclick="
      updateCalculation('5');
    ">
      5
    </button>
    <button onclick="
      updateCalculation('6');
    ">
      6
    </button>
  </p>

  <p>
    <button onclick="
      updateCalculation('7');
    ">
      7
    </button>
    <button onclick="
      updateCalculation('8');
    ">
      8
    </button>
    <button onclick="
      updateCalculation('9');
    ">
      9
    </button>
  </p>

  <button onclick="
    updateCalculation('+');
  ">
    +
  </button>
  <button onclick="
    calculation = eval(calculation);
    console.log(calculation);
  ">
    =
  </button>

  <script>
    let calculation = JSON.parse(localStorage.getItem('calculation')) || '';

    function updateCalculation(parameter) {
      calculation += parameter;
      console.log(calculation);

      localStorage.setItem('calculation', JSON.stringify(calculation));
    }

    document.querySelector('.js-calculation').innerHTML = calculation;
    

  </script>
</body>
</html>
