<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9c</title>
</head>
<body>
  <button onclick="displayButtonChoice('heads');">heads</button>
  <button onclick="displayButtonChoice('tails');">tails</button>
  <p class="js-choice"></p>

  <script>
    function displayButtonChoice(choice) {
      let choiceText = '';

      if (choice === 'heads') {
        choiceText = 'You chose: heads';
      } else {
        choiceText = 'You chose: tails';
      }

      document.querySelector('p').innerHTML = choiceText;
    }
  </script>
</body>
</html>
