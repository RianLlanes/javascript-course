<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10i</title>
  <style>
    body {
      background-color: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      height: 60px;
      width: 60px;
      border-radius: 60px;
      border: none;
      font-size: 26px;
      cursor: pointer;
      margin-right: 5px;
      color: white;
    }

    .calculation {
      font-size: 26px;
      color: white;
    }

    .gray-button {
      background-color: rgb(51, 51, 51);
    }

    .operator-button {
      background-color: rgb(254, 160, 10)
    }

    .clear-button {
      font-size: 17px;
    }
  </style>
</head>
<body>

  <p class="js-calculation calculation"></p>
  <p>
    <button onclick="
      updateCalculation('1');
    " class="gray-button">
      1
    </button>
    <button onclick="
      updateCalculation('2');
    " class="gray-button">
      2
    </button>
    <button onclick="
      updateCalculation('3');
    " class="gray-button">
      3
    </button>
    <button onclick="
      updateCalculation('+');
    " class="operator-button">
      +
    </button>
  </p>

  <p>
    <button onclick="
      updateCalculation('4');
    " class="gray-button">
      4
    </button>
    <button onclick="
      updateCalculation('5');
    " class="gray-button">
      5
    </button>
    <button onclick="
      updateCalculation('6');
    " class="gray-button">
      6
    </button>
    <button onclick="
      updateCalculation('-');
    " class="operator-button">
      -
    </button>
  </p>

  <p>
    <button onclick="
      updateCalculation('7');
    " class="gray-button">
      7
    </button>
    <button onclick="
      updateCalculation('8');
    " class="gray-button">
      8
    </button>
    <button onclick="
      updateCalculation('9');
    " class="gray-button">
      9
    </button>
    <button onclick="
      updateCalculation('*');
    " class="operator-button">
      *
    </button>
  </p>

  <p>
    <button onclick="
      updateCalculation('0');
    " class="gray-button">
      0
    </button>
    <button onclick="
      updateCalculation('.');
    " class="gray-button">
      .
    </button>
    <button onclick="
      evaluateCalculationElement();
    " class="gray-button">
      =
    </button>
    <button onclick="
      updateCalculation('/');
    " class="operator-button">
      /
    </button>
  </p>

  <p>
    <button onclick="
      clearCalculation();
    " class="gray-button clear-button">
      Clear
    </button>
  </p>


  <script>
    let calculation = JSON.parse(localStorage.getItem('calculation')) || '';

    const calculationElement = document.querySelector('.js-calculation');

    function updateCalculation(parameter) {
      calculation += parameter;
      console.log(calculation);

      localStorage.setItem('calculation', JSON.stringify(calculation));
      updateCalculationElement();
    }

    document.querySelector('.js-calculation').innerHTML = calculation;
    
    function updateCalculationElement() {
      calculationElement.innerHTML = calculation;
    }

    function evaluateCalculationElement() {
      calculation = eval(calculation);
      updateCalculationElement();
    }

    function clearCalculation() {
      calculation = '';
      updateCalculationElement();
    }

    updateCalculationElement();
  </script>
</body>
</html>
