<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8j</title>
</head>
<body>
  <button onclick="
    playGame('heads');  
  ">heads</button>

  <button onclick="
    playGame('tails');  
  ">tails</button>
  
  <script>
    let score = {
      wins: 0,
      losses: 0
    }

    let result = '';
    let guess = '';
    
    function playGame(guess) {
      let randomNumber = Math.random();

      if (randomNumber < 0.5) {
        result = 'heads';
      } else {
        result = 'tails';
      }

      console.log(result === guess ? 'You win!' : 'You lose!');

      if (guess === result) {
        score.wins++;
      } else {
        score.losses++;
      }

      console.log(score);
    }
  </script>
</body>
</html>
