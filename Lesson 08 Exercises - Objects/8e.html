  <script>
    const productA = {
      name: 'basketball',
      price: 500
    }

    const productB = {
      name: 'shoes',
      price: 2095
    }

    const productC = {
      name: 'shoes',
      price: 2095
    }

    function isSameProduct(product1, product2) {
      if (product1.name === product2.name && product1.price === product2.price) {
        return true;
      } else {
        return false;
      }
    }

    console.log(isSameProduct(productA, productB));
    console.log(isSameProduct(productB, productC));
  </script>
